[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna"
version = "0.1.0"
description = "Plot and analyze antenna S11 and radiation pattern measurements"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "scikit-rf"]

[project.optional-dependencies]
dev = ["pytest"]

# Explicit list: the antenna.venv folder next to the package must not be picked up.
[tool.setuptools]
packages = ["antenna", "antenna.readers"]
